<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llamaDesk</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="highlight-dark.css" id="hljs-theme">
<link rel="shortcut icon" href="./Assets/favicon.png" type="image/x-icon">
<script src="highlight.min.js" defer></script>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="brand"><img src="./Assets/favicon.png" alt="Icon"> llamaDesk</div>
    <button class="new-chat" id="newChat">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      New chat
    </button>
    <input class="search" id="q" type="search" placeholder="Search chats" aria-label="Search chats" autocomplete="off">
    <div id="list"></div>
    <div class="side-foot">
      <div class="status" id="status"><i></i><span>Connecting…</span></div>
      <button class="icon-btn" id="openSettings" aria-label="Settings" title="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main id="main" class="empty">
    <div class="top">
      <button class="icon-btn" id="toggleSide" aria-label="Toggle sidebar" title="Toggle sidebar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
      <button class="icon-btn newc" id="newChatTop" aria-label="New chat" title="New chat">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      </button>
    </div>

    <div id="scroll"><div id="thread"></div></div>

    <div class="hero">
      <div class="wordmark"><img src="./Assets/favicon.png" alt="Icon">llamaDesk</div>
    </div>

    <div class="composer-wrap">
      <div class="banner" id="banner" hidden></div>
      <div class="composer" id="composer">
        <div id="pending"></div>
        <textarea id="input" rows="1" placeholder="What do you want to know?" aria-label="Message"></textarea>
        <div class="composer-row">
          <div class="row-left">
            <button class="round-btn" id="attach" aria-label="Attach images or text files" title="Attach images or text files">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6l8.3-8.3"/></svg>
            </button>
            <button class="round-btn" id="mic" type="button" aria-label="Voice input" title="Voice input" hidden>
              <!-- icon set by JS -->
            </button>
          </div>
          <div class="row-right">
            <div class="dd" id="modelDd">
              <button type="button" class="dd-btn" id="modelBtn" aria-haspopup="listbox" aria-expanded="false" aria-label="Choose model">
                <span class="dd-label" id="modelLabel">Select model</span>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
              </button>
              <div class="dd-menu" id="modelMenu" role="listbox" aria-label="Models"></div>
            </div>
            <button id="send" aria-label="Send message"></button>
          </div>
        </div>
        <input type="file" id="file" multiple hidden
          accept="image/*,.txt,.md,.csv,.tsv,.json,.yaml,.yml,.xml,.html,.css,.js,.ts,.py,.sh,.c,.cpp,.h,.java,.go,.rs,.sql,.log,.ini,.toml">
      </div>
      <div class="chips" id="chips">
        <button class="pill" data-act="fill" data-text="Write a Python script that ">Write code</button>
        <button class="pill" data-act="attach">Summarize a file</button>
        <button class="pill" data-act="attach">Describe an image</button>
        <button class="pill" data-act="fill" data-text="Explain in simple terms: ">Explain something</button>
      </div>
      <div class="foot">Runs locally through Ollama. Answers can be wrong, so check anything important.</div>
    </div>
  </main>
</div>

<dialog id="settings">
  <div class="dlg-head">
    <h2>Settings</h2>
    <button class="icon-btn" id="closeSettings" aria-label="Close settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="dlg-body">
    <div class="field">
      <label for="base">Ollama address</label>
      <input type="text" id="base" spellcheck="false" autocomplete="off">
    </div>
    <div class="field">
      <label for="system">System prompt</label>
      <textarea id="system" placeholder="Optional. Example: Answer briefly and use bullet points."></textarea>
    </div>
    <div class="field">
      <div class="row"><label for="temp">Temperature</label><span id="tval">0.7</span></div>
      <input type="range" id="temp" min="0" max="2" step="0.1" value="0.7">
    </div>
    <div class="field">
      <label id="themeLabel">Theme</label>
      <div class="seg" id="themeSeg" role="radiogroup" aria-label="Theme">
        <button type="button" role="radio" data-v="dark" aria-checked="true">Dark</button>
        <button type="button" role="radio" data-v="light" aria-checked="false">Light</button>
        <button type="button" role="radio" data-v="system" aria-checked="false">System</button>
      </div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" id="refresh">Reload models</button>
      <button class="btn danger" id="wipe">Delete all chats</button>
    </div>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
