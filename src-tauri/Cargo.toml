[package]
name = "llamadesk"
version = "0.1.0"
description = "Ollama Desktop GUI app."
authors = ["Nsoro Allan"]
edition = "2021"

[lib]
name = "llamadesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-stt = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Optional later for GPU:
# tauri-plugin-stt = { version = "0.2", features = ["metal"] }   # macOS
# tauri-plugin-stt = { version = "0.2", features = ["cuda"] }    # Windows NVIDIA
# tauri-plugin-stt = { version = "0.2", features = ["vulkan"] }  # Linux

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
